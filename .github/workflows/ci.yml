name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# New PR updates replace obsolete validation; main/manual/merge-group runs are retained.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revisions:
    name: Select validation target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.target.outputs.revision }}
      coverage-base: ${{ steps.target.outputs.coverage-base }}
      label: ${{ steps.target.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select current revision and changed-code baseline
        id: target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $emptyTree = '4b825dc642cb6eb9a060e54bf8d69288fbee4904'
          $head = $env:GITHUB_SHA
          $base = $emptyTree
          function Test-GitRef([string] $ref) {
            $PSNativeCommandUseErrorActionPreference = $false
            git cat-file -e $ref 2>$null
            return $LASTEXITCODE -eq 0
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            # GITHUB_SHA is the PR merge candidate, including its current target branch.
            $base = $event.pull_request.base.sha
          } elseif ($env:GITHUB_EVENT_NAME -eq 'merge_group') {
            $base = $event.merge_group.base_sha
          } elseif ($event.before -and $event.before -notmatch '^0+$') {
            # An unavailable previous tip uses the empty tree for changed-code coverage.
            if (Test-GitRef $event.before) { $base = $event.before }
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and
                    (Test-GitRef 'refs/remotes/origin/main')) {
            $base = (git merge-base origin/main $head).Trim()
          }
          $short = (git rev-parse --short=7 $head).Trim()
          $subject = (git show --no-patch --format=%s $head).Trim()
          if ($subject.Length -gt 80) { $subject = $subject.Substring(0, 77) + '...' }
          "revision=$head" >> $env:GITHUB_OUTPUT
          "coverage-base=$base" >> $env:GITHUB_OUTPUT
          "label=$short — $subject" >> $env:GITHUB_OUTPUT
          "Validating one revision: $head; changed-code baseline: $base"

      - name: Require service communication diagram review
        shell: bash
        env:
          BASE: ${{ steps.target.outputs.coverage-base }}
          REVISION: ${{ steps.target.outputs.revision }}
        run: |
          set -euo pipefail
          changed=()
          while IFS= read -r -d '' path; do
            changed+=("$path")
          done < <(git diff --name-only --no-renames -z "$BASE" "$REVISION")

          review_all=false
          for path in "${changed[@]:-}"; do
            case "$path" in
              src/BuildingBlocks/*)
                [[ "$path" == *.md ]] || review_all=true
                ;;
              docker-compose*.yml|docker-compose*.yaml) review_all=true ;;
            esac
          done

          failed=false
          for directory in src/Services/*/; do
            [[ -d "$directory" ]] || continue
            service="${directory%/}"
            service="${service##*/}"
            document="${directory}COMMUNICATION.md"
            if [[ ! -f "$document" ]] || ! grep -q '^```mermaid$' "$document"; then
              echo "::error file=$document::Service $service needs a COMMUNICATION.md with a Mermaid diagram."
              failed=true
              continue
            fi

            review="$review_all"
            documented=false
            for path in "${changed[@]:-}"; do
              [[ "$path" != "$document" ]] || documented=true
              case "$path" in
                "${directory}"*|"tests/${service}/"*)
                  [[ "$path" == *.md ]] || review=true
                  ;;
              esac
            done
            if [[ "$review" == true && "$documented" != true ]]; then
              echo "::error file=$document::Update $service communication diagrams or add a specific review note explaining why communication is unchanged."
              failed=true
            fi
          done
          [[ "$failed" == false ]]

  validate:
    name: Validate ${{ needs.revisions.outputs.label }}
    needs: revisions
    uses: ./.github/workflows/validate-commit.yml
    with:
      revision: ${{ needs.revisions.outputs.revision }}
      coverage-base: ${{ needs.revisions.outputs.coverage-base }}

  required:
    name: CI / Required
    if: ${{ !cancelled() }}
    needs: [revisions, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REVISIONS_RESULT: ${{ needs.revisions.result }}
      VALIDATION_RESULT: ${{ needs.validate.result }}
    steps:
      - name: Require target selection and every validation stage to succeed
        run: |
          test "$REVISIONS_RESULT" = success
          test "$VALIDATION_RESULT" = success
