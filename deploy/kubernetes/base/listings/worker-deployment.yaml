apiVersion: apps/v1
kind: Deployment
metadata:
  name: listings-outbox-worker
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: listings-outbox-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: listings-outbox-worker
        app.kubernetes.io/part-of: smartlost
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: smartlost-listings-worker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_ENVIRONMENT
              value: Development
            - name: ConnectionStrings__ListingsDatabase
              valueFrom:
                secretKeyRef:
                  name: listings-credentials
                  key: connection-string
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: settings
              mountPath: /app/outboxsettings.json
              subPath: appsettings.json
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: settings
          configMap:
            name: listings-settings
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
