name: aset-master-year-1

services:
  auth-db:
    image: postgres:16-alpine
    container_name: aset-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: authservice
      POSTGRES_USER: authservice
      # Local development value; match the ignored appsettings.Docker.json.
      POSTGRES_PASSWORD: change-me-dev-db-password
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: aset-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  auth-service:
    container_name: aset-auth-service
    build:
      context: .
      dockerfile: src/Services/Auth/SmartLost.AuthService.Api/Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - type: bind
        source: ./src/Services/Auth/SmartLost.AuthService.Api/appsettings.Docker.json
        target: /app/appsettings.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8080:8080"

  auth-email-worker:
    container_name: aset-auth-email-worker
    build:
      context: .
      dockerfile: src/Services/Auth/SmartLost.AuthService.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Development
      Worker__Mode: Email
      OutboxDelivery__PollInterval: "00:00:02"
    volumes:
      - type: bind
        source: ./src/Services/Auth/SmartLost.AuthService.Api/appsettings.Docker.json
        target: /app/outboxsettings.json
        read_only: true
        bind:
          create_host_path: false

  auth-outbox-worker:
    profiles: [workers]
    build:
      context: .
      dockerfile: src/Services/Auth/SmartLost.AuthService.Worker/Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
    volumes:
      - type: bind
        source: ./src/Services/Auth/SmartLost.AuthService.Worker/outboxsettings.Docker.json
        target: /app/outboxsettings.json
        read_only: true
        bind:
          create_host_path: false

  matching-db:
    image: postgres:16-alpine
    container_name: aset-matching-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: matchingservice
      POSTGRES_USER: matchingservice
      # Local development value; match the ignored Matching appsettings.Docker.json.
      POSTGRES_PASSWORD: change-me-dev-matching-db-password
    ports:
      - "5434:5432"
    volumes:
      - matching-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  matching-service:
    container_name: aset-matching-service
    build:
      context: .
      dockerfile: src/Services/Matching/SmartLost.MatchingService.Api/Dockerfile
    depends_on:
      matching-db:
        condition: service_healthy
      # The cache degrades to the handler while Redis is starting or down.
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ListingsPhotos__ApiKey: ${LISTINGS_PHOTO_API_KEY:-}
      ListingsPhotos__BaseUrl: http://listings-service:8082
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}
    volumes:
      - type: bind
        source: ./src/Services/Matching/SmartLost.MatchingService.Api/appsettings.Docker.json
        target: /app/appsettings.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8081:8080"

  listings-db:
    image: postgres:16-alpine
    container_name: aset-listings-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: listingsservice
      POSTGRES_USER: listingsservice
      POSTGRES_PASSWORD: ${LISTINGS_POSTGRES_PASSWORD:?Set LISTINGS_POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - listings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  listings-service:
    image: smartlost-listings-api:local
    container_name: aset-listings-service
    build:
      context: .
      dockerfile: src/Services/Listings/SmartLost.ListingsService.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      listings-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080;http://+:8082
      MatchingAnalysis__BaseUrl: http://matching-service:8080
      ListingsPhotos__ApiKey: ${LISTINGS_PHOTO_API_KEY:-}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}
    volumes:
      - type: bind
        source: ./src/Services/Listings/SmartLost.ListingsService.Api/appsettings.Docker.json
        target: /app/appsettings.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:5081:8080"

  # Shared MediatR query cache for Listings and Matching. Cache only: no persistence,
  # bounded memory, password from the root .env and no host port.
  redis:
    image: redis:8.8.4-alpine
    container_name: aset-redis
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  auth-db-data:
  matching-db-data:
  listings-db-data:
    name: ${LISTINGS_POSTGRES_VOLUME:-aset-master-year-1_listings-db-data}
    external: ${LISTINGS_POSTGRES_VOLUME_EXTERNAL:-false}
