worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_tokens off;
        root /usr/share/nginx/html;
        client_max_body_size 11m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        location = /healthz { access_log off; return 204; }
        location ~ ^/api/auth(/|$) { proxy_pass http://auth-service:80; }
        location ~ ^/api/(listings|categories|match-decisions)(/|$) { proxy_pass http://listings-service:80; }
        location ~ ^/(api|internal)(/|$) { return 404; }
        location ~* \.(js|css|svg|ico|woff2?)$ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
