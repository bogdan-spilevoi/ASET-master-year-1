version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/src/**"
      - "/tests/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directories:
      - "/src/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
