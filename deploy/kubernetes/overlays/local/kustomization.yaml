apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smartlost
resources:
  - ../../base
patches:
  - path: auth-nodeport.yaml
  - path: listings-nodeport.yaml
  - path: matching-development.yaml
replicas:
  - name: auth-service
    count: 3
  - name: listings-service
    count: 3
  - name: matching-service
    count: 2
