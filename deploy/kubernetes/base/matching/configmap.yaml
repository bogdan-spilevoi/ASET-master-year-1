apiVersion: v1
kind: ConfigMap
metadata:
  name: matching-settings
  labels:
    smartlost/service: matching
data:
  appsettings.json: |
    {
      "AiRuntime": { "BaseUrl": "https://slightly-violin-handmade.ngrok-free.dev/", "PhotoDirectory": "/app/ai-photos", "CallTimeout": "00:02:00" },
      "MockAdapters": { "SlowDelay": "00:00:03" },
      "DraftAnalysis": { "WorkerEnabled": true },
      "RabbitMq": {
        "HostName": "rabbitmq", "Port": 5672, "VirtualHost": "smartlost",
        "Exchange": "smartlost.events", "ConnectionName": "matching-draft-analysis",
        "Bindings": { "smartlost.matching.draft-analysis": ["listings.draft.analysis-requested"] }
      },
      "Matching": {
        "Profiling": {
          "SlowOperationThreshold": "00:00:02",
          "SlowAiCallThreshold": "00:00:02",
          "AiCallTimeout": "00:00:05"
        }
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning",
          "Microsoft.EntityFrameworkCore": "Warning"
        }
      },
      "AllowedHosts": "*"
    }
