apiVersion: v1
kind: ConfigMap
metadata:
  name: listings-settings
data:
  appsettings.json: |
    {
      "DraftAnalysis": { "Enabled": true },
      "SeedData": { "Enabled": false },
      "OutboxInspection": { "BatchSize": 20, "PollInterval": "00:00:10" },
      "Worker": { "Mode": "Publish" },
      "OutboxDelivery": { "PollInterval": "00:00:02" },
      "Outbox": { "BatchSize": 20, "MaximumAttempts": 8 },
      "RabbitMq": {
        "HostName": "rabbitmq",
        "Port": 5672,
        "VirtualHost": "smartlost",
        "Exchange": "smartlost.events",
        "ConnectionName": "smartlost-listings-outbox",
        "Bindings": { "smartlost.listings.notifications": ["listings.*"], "smartlost.matching.draft-analysis": ["listings.draft.analysis-requested"] }
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning",
          "Microsoft.EntityFrameworkCore": "Warning"
        }
      },
      "AllowedHosts": "*"
    }
